# docker-compose.yml
version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
    networks:
      - telegram-monitor

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      - DB_DSN=mysql:host=mysql;dbname=telegram_monitor
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOSTNAME=redis
      - REDIS_PORT=6379
      - YII_DEBUG=true
      - YII_ENV=dev
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - telegram-monitor

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: telegram_monitor
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - telegram-monitor

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - telegram-monitor

volumes:
  mysql-data:

networks:
  telegram-monitor:
    driver: bridge